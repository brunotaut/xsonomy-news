name: Enrich product summaries

# Writes catalogue summaries for products that have none, using only the news articles
# already linked to each product. Never overwrites an existing summary. Rows whose
# articles do not actually describe the product are left empty and marked
# 'needs-review' rather than guessed at.
#
# Sized for roughly 60 products a day, which clears the ~2,300 summary-less rows in
# about five weeks. Resumable: enrichment_status marks what has been handled, so a
# re-run always moves on to new rows.

on:
  schedule:
    - cron: "0 4 * * *"          # daily 04:00 UTC, before the catalogue build at 06:00
  workflow_dispatch:
    inputs:
      max:
        description: "Products this run"
        default: "60"
        required: true
      concurrency:
        description: "Parallel LLM calls"
        default: "3"
        required: true
      dry_run:
        description: "Draft and print without writing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: enrich-products
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write summaries from linked articles
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          node scripts/enrich-products.mjs \
            --max "${{ github.event.inputs.max || '60' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '3' }}" $DRY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
