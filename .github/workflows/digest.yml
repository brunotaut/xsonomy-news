name: Email digest (daily)

# Daily digest only. Weekly roundups and the monthly digest live in roundup.yml,
# because they also write and publish an archive page before sending.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"      # every morning 08:00 UTC (GMT) — daily digest

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send digest
        run: node scripts/digest.mjs --period day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          DIGEST_UNSUBSCRIBE: ${{ vars.DIGEST_UNSUBSCRIBE }}
          SITE_URL: ${{ vars.SITE_URL }}
