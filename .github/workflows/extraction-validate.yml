name: Validate extraction safeguards

# Manual only. Two jobs, both opt-in, because one calls the model and the other
# writes to the database.
#
#   mode = eval            READ-ONLY. Runs the real extraction model over the
#                          four known-bad sources, or a sample, and prints what
#                          the identity rules decide. Writes nothing: no
#                          products, no article links, no article patches.
#
#   mode = backfill-dry    Evidence backfill in dry mode. Calls the model,
#                          writes NOTHING.
#
#   mode = backfill-pilot  Evidence backfill for `pilot_size` articles only.
#                          Writes ONLY articles.entity_evidence.
#
#   mode = backfill        Evidence backfill for the remaining backlog, capped
#                          by `max_articles`. Writes ONLY entity_evidence.
#
#   mode = replay-dry      Re-applies today's maker rules to evidence already
#                          stored. NO model calls, NO writes — reports only.
#
#   mode = replay          The same, applied. Writes ONLY entity_evidence, and
#                          only ever adds a maker, except where the row stores
#                          the makerQuote its maker was decided from.
#
# None of these resolve entities, create products, publish anything, clear the
# decision cache or touch article links.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "eval | backfill-dry | backfill-pilot | backfill | replay-dry | replay"
        required: true
        default: "eval"
      sample:
        description: "eval only: how many recent pending articles (blank = the 4 affected sources)"
        required: false
        default: ""
      pilot_size:
        description: "backfill-pilot only: articles in the pilot"
        required: false
        default: "10"
      max_articles:
        description: "backfill only: cap for this run"
        required: false
        default: "100"
      concurrency:
        description: "parallel model calls"
        required: false
        default: "3"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # This repo had no dependencies at all until the company funding work added
      # @electric-sql/pglite as a devDependency, so no workflow ever installed
      # anything and `npm test` ran straight off a bare checkout. The moment one
      # test imported a package, the whole suite failed to load it.
      #
      # `--include=dev` is explicit on purpose: devDependencies are what the tests
      # need, and `npm ci` omits them whenever NODE_ENV=production is set in the
      # environment, which would reintroduce exactly this failure silently.
      - name: Install dependencies from the lockfile (devDependencies included)
        run: npm ci --include=dev

      - name: Unit tests must pass before anything touches the model or the database
        run: npm test

      # This step FAILS the job when a required case gives the wrong answer
      # (exit 1) or was never actually tested (exit 3). The first production
      # run reported success while one required article came back unparseable
      # and three cases went untested; a green run must now mean the
      # acceptance checks passed.
      - name: Read-only evaluation (real model, no writes)
        id: eval
        if: github.event.inputs.mode == 'eval'
        run: |
          # pipefail is essential: without it the exit status of the pipeline is
          # tee's, so a failing evaluation would report success — the very bug
          # being fixed here.
          set -o pipefail
          node scripts/eval-extraction.mjs \
            --affected \
            --sample "${{ github.event.inputs.sample || '12' }}" \
            --out eval-results.json \
            | tee eval-log.txt
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Uploaded on failure too — the diagnostics are the point when it fails.
      - name: Upload evaluation result and log
        if: always() && github.event.inputs.mode == 'eval'
        uses: actions/upload-artifact@v4
        with:
          name: extraction-eval
          path: |
            eval-results.json
            eval-log.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Evidence backfill — DRY RUN (no writes)
        if: github.event.inputs.mode == 'backfill-dry'
        run: node scripts/analyze-backfill.mjs --missing-evidence --dry --max 25 --concurrency ${{ github.event.inputs.concurrency }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Evidence backfill — PILOT (writes entity_evidence only)
        if: github.event.inputs.mode == 'backfill-pilot'
        run: node scripts/analyze-backfill.mjs --missing-evidence --max ${{ github.event.inputs.pilot_size }} --batch 10 --concurrency ${{ github.event.inputs.concurrency }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Evidence backfill — REMAINDER (writes entity_evidence only)
        if: github.event.inputs.mode == 'backfill'
        run: node scripts/analyze-backfill.mjs --missing-evidence --max ${{ github.event.inputs.max_articles }} --batch 25 --concurrency ${{ github.event.inputs.concurrency }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # No model calls: the verdict is recomputed from the evidence already on
      # the row, so a rule change costs nothing to apply to past extractions.
      - name: Maker-rule replay — DRY (no writes)
        if: github.event.inputs.mode == 'replay-dry'
        run: node scripts/replay-maker-rules.mjs --dry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Maker-rule replay — APPLY (writes entity_evidence only)
        if: github.event.inputs.mode == 'replay'
        run: node scripts/replay-maker-rules.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Derived-taxonomy check (read-only, always)
        continue-on-error: true
        run: npm run check:taxonomy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
