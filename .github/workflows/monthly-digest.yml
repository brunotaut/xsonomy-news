name: Monthly digest

# The monthly digest: a written lead, the trends numbers, and a ranked shortlist
# of the stories the most outlets carried. Unlike the daily and weekly mailouts
# (digest.yml), this one is also published as a permanent page on the site.
#
# Three stages on purpose. The email links to that archive page, so the page has
# to be live BEFORE the email goes out:
#   1. archive – write archive/digests/<slug>.html, commit it, rebuild the site
#   2. deploy  – publish to GitHub Pages
#   3. send    – email the issue, now that the link resolves
#
# (A commit pushed with GITHUB_TOKEN deliberately does not trigger other
# workflows, so ingest-and-deploy.yml will NOT pick this up — hence the
# build/deploy steps here rather than relying on the push.)

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to publish as YYYY-MM (blank = the last 30 days)"
        type: string
        required: false
  schedule:
    - cron: "0 7 1 * *"      # 1st of the month 07:00 UTC

permissions:
  contents: write            # to commit the archive page
  pages: write
  id-token: write

concurrency:
  group: news-pages          # shared with ingest-and-deploy: never two Pages deploys at once
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Blank input = the rolling last 30 days; YYYY-MM backfills that calendar
      # month against the one before it.
      - name: Resolve arguments
        id: a
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "args=--month ${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--period month" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the archive page (no email yet)
        run: node scripts/digest.mjs ${{ steps.a.outputs.args }} --skip-send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Commit the archive page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/digests
          if git diff --cached --quiet; then
            echo "No new archive page to commit."
          else
            git commit -m "Add monthly digest archive page"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build the static site (now including the new issue)
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          HOME_URL: ${{ vars.HOME_URL }}
          CNAME: ${{ vars.NEWS_CNAME }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: archive
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  send:
    needs: [archive, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve arguments
        id: a
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "args=--month ${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--period month" >> "$GITHUB_OUTPUT"
          fi
      - name: Send the monthly digest
        run: node scripts/digest.mjs ${{ steps.a.outputs.args }} --skip-archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          DIGEST_UNSUBSCRIBE: ${{ vars.DIGEST_UNSUBSCRIBE }}
          SITE_URL: ${{ vars.SITE_URL }}
